research:
- slug: uq
  title: Uncertainty Quantification
  kicker: Research Area 01
  summary: Quantifying uncertainties in hazards, structural properties, numerical
    models, and system performance.
  topics:
  - Probabilistic modeling and uncertainty propagation
  - Structural reliability and risk assessment
  - Surrogate modeling and data-driven simulation
- slug: hazards
  title: Natural Hazards
  kicker: Research Area 02
  summary: Characterizing natural hazards and their interactions with buildings and
    infrastructure systems.
  topics:
  - Extreme weather and multi-hazard processes
  - Hazard characterization and event analysis
  - Compound and cascading disaster scenarios
  detail_image: research-detail-hazards.webp
- slug: wind
  title: Wind Engineering
  kicker: Research Area 03
  summary: Understanding extreme wind environments and wind-induced structural performance.
  topics:
  - Downburst and non-synoptic winds
  - Wind loading and dynamic structural response
  - Wind hazard prediction and assessment
- slug: structural
  title: Structural Engineering
  kicker: Research Area 04
  summary: Evaluating the behavior and safety of structural systems using mechanics
    and computational analysis.
  topics:
  - Bridge and cable-supported structures
  - Nonlinear structural analysis
  - Performance and safety assessment
- slug: resilience
  title: Infrastructure Resilience
  kicker: Research Area 05
  summary: Assessing risk and resilience across interconnected infrastructure systems
    exposed to natural hazards.
  topics:
  - System-level risk and vulnerability
  - Resilience-based performance assessment
  - Risk-informed decision support
  detail_image: research-detail-resilience.webp
