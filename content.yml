lab:
  name: SHARE Lab
  full_name: Systems and Hazards Analysis for Resilience to Extremes
  university: Dankook University
  department: Department of Civil and Environmental Engineering
  address: Engineering Building II, Room 214, Dankook University, Yongin, Republic
    of Korea
  tagline: Advancing Infrastructure Resilience through System–Hazard Interaction Analysis
    and Uncertainty Quantification
  short_intro: We investigate how natural hazards interact with structures and infrastructure
    systems. Our work combines uncertainty quantification, hazard analysis, and structural
    engineering to advance risk-informed decisions and infrastructure resilience.
  about: SHARE Lab explores the behavior and performance of built infrastructure under
    uncertain environmental loads and natural hazards. By integrating probabilistic
    methods, computational modeling, and data-driven analysis, we aim to understand
    risk and support more resilient infrastructure systems.
  email: wjung@dankook.ac.kr
  phone: 031-8005-3483
