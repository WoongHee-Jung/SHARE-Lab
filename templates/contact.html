<div class="wrap">
  <div class="page-head">
    <div class="eyebrow">SHARE LAB / CONTACT</div>
    <h1>Contact</h1>
    <p>Connect with SHARE Lab at Dankook University.</p>
  </div>
  <section class="content-section contact-section" aria-label="Laboratory contact information">
    <div class="contact-box">
      <div class="small-label">FIND US</div>
      <h2>SHARE Lab</h2>
      <p class="contact-department">{{lab.department}}<br>{{lab.university}}</p>
      <div class="contact-details">
        <div class="contact-item">
          <div class="small-label">OFFICE</div>
          <p>Engineering Building II, Room 214<br>Dankook University, Yongin, Republic of Korea</p>
        </div>
        <div class="contact-item">
          <div class="small-label">EMAIL</div>
          <a href="mailto:{{lab.email}}">{{lab.email}}</a>
        </div>
        <div class="contact-item">
          <div class="small-label">PHONE</div>
          <a href="tel:+823180053483">{{lab.phone}}</a>
        </div>
      </div>
    </div>
  </section>
</div>
