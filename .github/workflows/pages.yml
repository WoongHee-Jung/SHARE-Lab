name: Publish SHARE Lab Website

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * 1' # Every Monday at 11:15 in Korea

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: share-lab-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install website dependencies
        run: python -m pip install pyyaml jinja2

      - name: Update publications from OpenAlex (if configured)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_AUTHOR_ID: ${{ vars.OPENALEX_AUTHOR_ID }}
        shell: bash
        run: |
          if [ -n "$OPENALEX_API_KEY" ]; then
            python scripts/sync_publications.py || echo "Publication sync unavailable; retaining existing list."
          else
            echo "No OpenAlex API key: using existing publications."
          fi

      - name: Save refreshed publication list (if changed)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if ! git diff --quiet -- publications_auto.yml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add publications_auto.yml
            git commit -m "Update OpenAlex bibliography"
            git push || echo "Unable to save updated bibliography to repository; deployment will still use it."
          fi

      - name: Build SHARE Lab pages from content.yml
        run: python build.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
